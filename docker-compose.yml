services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/memorybox.db
      MEDIA_ROOT: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
